name: Tests
on: [push]
jobs:
  tests:
    name: ${{ matrix.peers-backend }} - ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mariadb:latest
        env:
          MYSQL_ROOT_PASSWORD: peers
          MYSQL_DATABASE: peers_test
        ports:
          - 3306:3306
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: peers
          POSTGRES_DB: peers_test
        ports:
          - 5432:5432
    strategy:
      fail-fast: false
      matrix:
        python-version: [2.7, 3.7, 3.9, "3.10"]
        peers-backend:
          - "sqlite"
          - "postgresql"
          - "mysql"
        exclude:
          - python-version: 2.7
            peers-backend: postgresql
        include:
          - python-version: 3.7
            peers-backend: cockroachdb
          - python-version: "3.10"
            peers-backend: cockroachdb
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: deps
        env:
          PGUSER: postgres
          PGHOST: 127.0.0.1
          PGPASSWORD: peers
        run: |
          pip install psycopg2-binary cython pymysql 'apsw<3.38' mysql-connector
          python setup.py build_ext -i
          psql peers_test -c 'CREATE EXTENSION hstore;'
      - name: sqlcipher
        if: ${{ matrix.python-version != 2.7 }}
        run: pip install sqlcipher3-binary
      - name: crdb
        if: ${{ matrix.peers-backend == 'cockroachdb' }}
        run: |
          wget -qO- https://binaries.cockroachdb.com/cockroach-v22.2.6.linux-amd64.tgz | tar xz
          ./cockroach-v22.2.6.linux-amd64/cockroach start-single-node --insecure --background
          ./cockroach-v22.2.6.linux-amd64/cockroach sql --insecure -e 'create database peers_test;'
      - name: runtests ${{ matrix.peers-backend }} - ${{ matrix.python-version }}
        env:
          PEERS_TEST_BACKEND: ${{ matrix.peers-backend }}
          PGUSER: postgres
          PGHOST: 127.0.0.1
          PGPASSWORD: peers
        run: python runtests.py --mysql-user=root --mysql-password=peers
