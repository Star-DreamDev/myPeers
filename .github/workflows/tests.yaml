name: Tests
on: [push]
jobs:
  tests:
    name: ${{ matrix.peers-backend }} - ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mariadb:latest
        env:
          MYSQL_ROOT_PASSWORD: peers
          MYSQL_DATABASE: peers_test
        ports:
          - 3306:3306
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: peers
          POSTGRES_DB: peers_test
        ports:
          - 5432:5432
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.9, "3.11", "3.13", "3.14"]
        peers-backend:
          - "sqlite"
          - "postgresql"
          - "mysql"
        include:
          - python-version: "3.8"
            peers-backend: sqlite
          - python-version: "3.12"
            peers-backend: sqlite
          - python-version: "3.12"
            peers-backend: psycopg3
          - python-version: "3.13"
            peers-backend: psycopg3
          - python-version: "3.14"
            peers-backend: psycopg3
          - python-version: "3.13"
            peers-backend: cysqlite
          - python-version: "3.13"
            peers-backend: cockroachdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: deps
        env:
          PGUSER: postgres
          PGHOST: 127.0.0.1
          PGPASSWORD: peers
        run: |
          sudo apt-get install libsqlite3-dev
          pip install setuptools psycopg2-binary cython pymysql 'apsw' mysql-connector sqlcipher3 pysqlite3 'psycopg[binary]'
          pip install greenlet aiosqlite aiomysql asyncpg
          python setup.py build_ext -i
          psql peers_test -c 'CREATE EXTENSION hstore;'
      - name: crdb
        if: ${{ matrix.peers-backend == 'cockroachdb' }}
        run: |
          wget -qO- https://binaries.cockroachdb.com/cockroach-v22.2.6.linux-amd64.tgz | tar xz
          ./cockroach-v22.2.6.linux-amd64/cockroach start-single-node --insecure --background
          ./cockroach-v22.2.6.linux-amd64/cockroach sql --insecure -e 'create database peers_test;'
      - name: cysqlite
        if: ${{ matrix.peers-backend == 'cysqlite' || matrix.peers-backend == 'sqlite' }}
        run: |
          pip install -e 'git+https://github.com/coleifer/cysqlite#egg=cysqlite'
      - name: runtests ${{ matrix.peers-backend }} - ${{ matrix.python-version }}
        env:
          PEERS_TEST_BACKEND: ${{ matrix.peers-backend }}
          PGUSER: postgres
          PGHOST: 127.0.0.1
          PGPASSWORD: peers
          CI: 1
        run: python runtests.py --mysql-user=root --mysql-password=peers -s -v2
